name: Production timezone and reading UI fix
on:
  push:
    branches: [codex/production-timezone-and-reading-ui-fix]
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""const format = new Intl.DateTimeFormat('en-CA', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' });
            const parts = Object.fromEntries(format.formatToParts(date).filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
            return { year: Number(parts.year), month: Number(parts.month), day: Number(parts.day) };"""
          new="""const format = new Intl.DateTimeFormat('en-CA', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
            const parts = Object.fromEntries(format.formatToParts(date).filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
            const toNumber = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
            return { year: toNumber(parts.year), month: toNumber(parts.month), day: toNumber(parts.day), hour: toNumber(parts.hour), minute: toNumber(parts.minute) };"""
          if old not in s: raise SystemExit('getDateParts target not found')
          s=s.replace(old,new,1)
          old="""            const settings = typeof AppConfig !== 'undefined' && typeof AppConfig.getCurrent === 'function' ? AppConfig.getCurrent() : {};
            if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
      window.__tenmeiTimeZonePersisting = true;
      try { AppConfig.toggle('timeZone', next); }
      finally { window.__tenmeiTimeZonePersisting = false; }
  } else {
      settings.timeZone = next;
  }
  try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}
            const signedInUser = typeof currentState !== 'undefined' && currentState && currentState.user ? currentState.user : null;
            const key = signedInUser ? `lab_settings_${signedInUser.email}` : 'lab_settings_guest';
            try { localStorage.setItem(key, JSON.stringify(settings)); } catch (error) {}"""
          new="""            const settings = typeof AppConfig !== 'undefined' && typeof AppConfig.getCurrent === 'function' ? AppConfig.getCurrent() : {};
            settings.timeZone = next;
            try {
                const key = (typeof currentState !== 'undefined' && currentState && currentState.user)
                    ? `lab_settings_${currentState.user.email}`
                    : 'lab_settings_guest';
                const stored = { ...settings, timeZone: next };
                localStorage.setItem(key, JSON.stringify(stored));
                localStorage.setItem('tenmei_timezone_setting', next);
            } catch (error) {}
            // 永続化が完了してから同期処理を実行する。
            if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
                window.__tenmeiTimeZonePersisting = true;
                try { AppConfig.toggle('timeZone', next); }
                finally { window.__tenmeiTimeZonePersisting = false; }
            }"""
          if old not in s: raise SystemExit('setTimeZone target not found')
          s=s.replace(old,new,1)
          if 'READING NAVIGATION' not in s: raise SystemExit('reading navigation label not found')
          s=s.replace('READING NAVIGATION','読書中',1)
          marker="var indent = isH3 ? '' : 'ml-4';"; pos=s.find(marker)
          if pos<0: raise SystemExit('TOC item marker not found')
          line_end=s.find("\n",s.find("items += ",pos))
          replacement="""var itemClass = isH3 ? 'article-toc-item article-toc-item--h3' : 'article-toc-item article-toc-item--h4';
                var icon = isH3 ? 'bi-caret-right-fill' : 'bi-dot';
                items += '<li class="' + itemClass + '"><a href="#' + id + '" onclick="event.preventDefault(); var t=document.getElementById(\'' + id + '\'); if(t) t.scrollIntoView({behavior:\'smooth\', block:\'start\'});"><i class="bi ' + icon + '" aria-hidden="true"></i><span>' + h.textContent + '</span></a></li>';"""
          s=s[:pos]+replacement+s[line_end:]
          s=s.replace("toc.className = 'article-toc-unified mb-6';","toc.className = 'article-toc-unified article-toc-simple mb-6';",1)
          old="""'<div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur p-6 rounded-2xl border border-gray-200 dark:border-gray-700">' +
                    '<p class="font-bold text-sm text-gray-500 mb-3 uppercase tracking-wider"><i class="bi bi-list-ul mr-2"></i>目次</p>' +
                    '<ul class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 text-sm font-medium">' + items + '</ul>' +
                '</div>'"""
          new="""'<div class="article-toc-panel">' +
                    '<p class="article-toc-title"><i class="bi bi-list-ul" aria-hidden="true"></i><span>目次</span></p>' +
                    '<ul class="article-toc-list">' + items + '</ul>' +
                '</div>'"""
          if old not in s: raise SystemExit('TOC inner target not found')
          s=s.replace(old,new,1)
          style=r'''<style id="production-timezone-reading-ui-fix">
#reading-progress-badge{background:var(--card-bg,#fff)!important;border:1px solid color-mix(in srgb,var(--border-color,#d6d3d1) 82%,transparent)!important;border-radius:12px!important;box-shadow:0 6px 20px rgba(0,0,0,.08)!important;background-image:none!important}
#reading-progress-badge .rp-kicker{color:var(--text-secondary,#57534e)!important;letter-spacing:.06em!important}
.rp-details{background:var(--card-bg,#fff)!important;border:1px solid color-mix(in srgb,var(--border-color,#d6d3d1) 82%,transparent)!important;border-radius:12px!important;box-shadow:0 6px 20px rgba(0,0,0,.08)!important;background-image:none!important}
.article-toc-simple{width:100%!important;max-width:var(--article-support-max-width,820px)!important;margin:0 auto 1.25rem!important}
.article-toc-simple .article-toc-panel{padding:1rem 1.1rem!important;border:1px solid var(--border-color,#e7e5e4)!important;border-radius:12px!important;background:var(--card-bg,#fff)!important}
.article-toc-simple .article-toc-title{display:flex;align-items:center;gap:.45rem;margin:0 0 .7rem!important;color:var(--text-primary,#292524)!important;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.82rem;font-weight:800}
.article-toc-simple .article-toc-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:.35rem .9rem!important;margin:0!important;padding:0!important;list-style:none!important}
.article-toc-simple .article-toc-item a{display:flex;align-items:flex-start;gap:.45rem;min-height:2rem;padding:.35rem .45rem;border-radius:7px;color:var(--text-secondary,#57534e);text-decoration:none;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.78rem;line-height:1.5;transition:background-color .16s ease,color .16s ease}
.article-toc-simple .article-toc-item a:hover{background:color-mix(in srgb,var(--accent-red,#a52a32) 7%,transparent);color:var(--accent-red,#a52a32)}
.article-toc-simple .article-toc-item a:focus-visible{outline:2px solid var(--accent-red,#a52a32);outline-offset:2px}
.article-toc-simple .article-toc-item--h3 a{font-weight:750;color:var(--text-primary,#292524)}
.article-toc-simple .article-toc-item--h4 a{padding-left:1.15rem;font-size:.75rem}
.article-toc-simple .article-toc-item i{flex:0 0 auto;margin-top:.22rem}
.tenmei-choice__trigger{min-height:42px!important;padding:.55rem .75rem!important;border-radius:10px!important;border:1px solid var(--border-color,#d6d3d1)!important;box-shadow:0 2px 8px rgba(0,0,0,.05)!important;background:var(--card-bg,#fff)!important}
.tenmei-choice__trigger:focus-visible{outline:2px solid var(--accent-red,#a52a32)!important;outline-offset:2px}
.tenmei-choice__popover{border:1px solid var(--border-color,#d6d3d1)!important;border-radius:10px!important;box-shadow:0 10px 28px rgba(0,0,0,.12)!important;background:var(--card-bg,#fff)!important}
.tenmei-choice__option{border-radius:7px!important;margin:2px 4px!important;padding:.55rem .65rem!important}
.tenmei-choice__option:hover,.tenmei-choice__option[aria-selected="true"]{background:color-mix(in srgb,var(--accent-red,#a52a32) 8%,transparent)!important}
.time-zone-option{border-radius:10px!important;border:1px solid var(--border-color,#d6d3d1)!important;background:var(--card-bg,#fff)!important;box-shadow:0 2px 8px rgba(0,0,0,.04)!important}
.time-zone-option:hover,.time-zone-option:focus-visible{border-color:var(--accent-red,#a52a32)!important}
@media (max-width:700px){.article-toc-simple .article-toc-list{grid-template-columns:1fr!important}#reading-progress-badge,.rp-details{width:min(660px,calc(100vw - 24px))!important}}
</style>'''
          if 'production-timezone-reading-ui-fix' not in s: s=s.replace('</head>',style+'</head>',1)
          p.write_text(s,encoding='utf-8')
          t=Path('tests/reading-progress-ui-regression.cjs'); ts=t.read_text(encoding='utf-8')
          ts=ts.replace("  '<span id="reading-progress-time" class="rp-time">残り約0分</span>',","  '<span id="reading-progress-time" class="rp-time">残り約0分</span>',
  '読書中',
  'article-toc-simple',
  'tenmei-choice__trigger',",1)
          ts=ts.replace("assert.equal(html.includes('article-reading-progress'), false, '記事ヘッダー内に旧来の読書進捗面を残してはいけません。');","assert.equal(html.includes('article-reading-progress'), false, '記事ヘッダー内に旧来の読書進捗面を残してはいけません。');
assert.equal(html.includes('READING NAVIGATION'), false, '読書ナビゲーションの英語表示を残してはいけません。');
assert(html.includes('grid-template-columns:repeat(2,minmax(0,1fr))'), 'PCでは目次を2列で表示する必要があります。');
assert(html.includes('@media (max-width:700px)'), 'モバイル向け目次1列切替を維持する必要があります。');",1)
          t.write_text(ts,encoding='utf-8')
          t=Path('tests/timezone-control-regression.cjs'); ts=t.read_text(encoding='utf-8')
          ts+="""\nassert(/hour:\s*'2-digit'/.test(html));\nassert(/minute:\s*'2-digit'/.test(html));\nassert(/hourCycle:\s*'h23'/.test(html));\nassert(/settings\.timeZone\s*=\s*next[\s\S]*localStorage\.setItem\(key, JSON\.stringify\(stored\)\)[\s\S]*AppConfig\.toggle\('timeZone', next\)/.test(html));\n"""
          t.write_text(ts,encoding='utf-8')
          PY
      - name: Tests
        run: |
          git diff --check
          node tests/timezone-control-regression.cjs
          node tests/reading-progress-ui-regression.cjs
          node tests/security-regression.cjs
      - name: Commit final fix
        run: |
          rm -f .github/workflows/codex-production-timezone-and-reading-ui-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/timezone-control-regression.cjs tests/reading-progress-ui-regression.cjs .github/workflows/codex-production-timezone-and-reading-ui-fix.yml
          git commit -m 'fix: timezone persistence and reading UI'
          git push
