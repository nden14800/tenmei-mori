name: Browser smoke monitoring

on:
  push:
    paths:
      - "tests/status-browser-smoke.spec.js"
      - "functions/_middleware.js"
      - ".github/workflows/status-browser-smoke.yml"
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenmei-status-main
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke checks
        id: browser_smoke
        continue-on-error: true
        run: |
          rm -rf test-results
          mkdir -p test-results
          rm -f browser-smoke-report.json browser-smoke-stderr.log browser-smoke.exit
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=browser-smoke-report.json npx playwright test tests/status-browser-smoke.spec.js --workers=1 --reporter=json 2>browser-smoke-stderr.log
          exit_code=$?
          echo "$exit_code" > browser-smoke.exit
          exit "$exit_code"

      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.run_id }}
          path: |
            browser-smoke-report.json
            browser-smoke-stderr.log
            browser-smoke.exit
          if-no-files-found: warn
          retention-days: 7

      - name: Record browser smoke status
        env:
          SMOKE_OUTCOME: ${{ steps.browser_smoke.outcome }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const ok = process.env.SMOKE_OUTCOME === "success";
          const now = new Date().toISOString();
          let failureDetails = [];

          if (!ok) {
            try {
              const report = JSON.parse(
                fs.readFileSync("browser-smoke-report.json", "utf8")
              );

              const collect = (suite) => {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    for (const result of test.results || []) {
                      if (result.status === "failed" || result.error) {
                        const error = result.error;
                        const message =
                          typeof error === "string"
                            ? error
                            : error?.message || "Playwright test failed";
                        failureDetails.push({
                          check: spec.title,
                          message: String(message).slice(0, 2000)
                        });
                      }
                    }
                  }
                }
                for (const child of suite.suites || []) collect(child);
              };

              for (const suite of report.suites || []) collect(suite);
            } catch (error) {
              failureDetails.push({
                check: "browser-smoke-report",
                message: `監視結果の詳細取得に失敗しました: ${error.message}`
              });
            }
          }

          const uniqueFailures = failureDetails.filter(
            (item, index, all) =>
              all.findIndex(
                (candidate) =>
                  candidate.check === item.check &&
                  candidate.message === item.message
              ) === index
          );

          if (!ok && uniqueFailures.length === 0) {
            try {
              const stderr = fs.readFileSync("browser-smoke-stderr.log", "utf8").trim();
              if (stderr) {
                uniqueFailures.push({
                  check: "browser-smoke",
                  message: stderr.replace(/\\s+/g, " ").slice(0, 2000)
                });
              }
            } catch {}
          }

          const checks = {
            mainSite: "UP",
            developerView: "UP",
            internalNavigation: "UP",
            javascriptErrors: "UP",
            statusPage: "UP"
          };

          const checkKeysForFailure = (title) => {
            if (/main site loads without browser JavaScript errors/i.test(title)) {
              return ["mainSite", "javascriptErrors"];
            }
            if (/internal navigation works, including developer view/i.test(title)) {
              return ["internalNavigation", "developerView"];
            }
            if (/representative navigation controls are wired/i.test(title)) {
              return ["internalNavigation"];
            }
            if (/status page uses local stylesheets/i.test(title)) {
              return ["statusPage"];
            }
            return Object.keys(checks);
          };

          for (const failure of uniqueFailures) {
            for (const key of checkKeysForFailure(failure.check)) {
              checks[key] = "DOWN";
            }
          }

          if (!ok && uniqueFailures.length === 0) {
            for (const key of Object.keys(checks)) checks[key] = "DOWN";
          }

          const data = {
            status: ok ? "UP" : "DOWN",
            checkedAt: now,
            checks,
            failureDetails: uniqueFailures,
            message: ok
              ? "ブラウザから主要画面・内部遷移・JavaScriptエラー・Status PageのCSS依存を確認しました。"
              : uniqueFailures.length
                ? uniqueFailures.map((item) => `${item.check}: ${item.message}`).join(" / ")
                : "ブラウザ機能監視が失敗しました。GitHub Actionsの実行ログを確認してください。"
          };

          fs.writeFileSync(
            "status/browser-health.json",
            JSON.stringify(data, null, 2) + "\n"
          );
          NODE

      - name: Commit browser smoke result
        run: |
          cp status/browser-health.json /tmp/browser-health.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/browser-health.json status/browser-health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/browser-health.json
          if git diff --cached --quiet; then
            echo "Browser smoke status unchanged."
            exit 0
          fi
          git commit -m "chore(status): update browser smoke health"
          git push origin HEAD:main
