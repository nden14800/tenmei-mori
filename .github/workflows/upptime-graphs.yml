name: Generate Upptime graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenmei-status-graphs
  cancel-in-progress: false

jobs:
  graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Upptime graphs
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: graphs
        env:
          GH_PAT: ${{ github.token }}
