name: Graphs CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - ".upptimerc.yml"
      - ".github/workflows/upptime-graphs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate graphs
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: graphs
        env:
          GH_PAT: ${{ github.token }}
