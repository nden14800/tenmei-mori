name: One-shot UI repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: unify public documents and AI UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Public-document reading width: the outer card stays full-width; only the inner
          # reading column follows the article width preference.
          start = s.find('<style id="tenmei-public-document-reading-complete-fix">')
          if start >= 0:
              end = s.find("</style>", start)
              if end < 0:
                  raise SystemExit("public reading style block is incomplete")
              style = '''<style id="tenmei-public-document-reading-complete-fix">
/* 公開文書は記事と同じく、外側のカード/フレームは全幅。幅設定は本文カラムだけに適用。 */
html:is(.public-document-reading-disabled) :is(#view-about,#view-privacy,#view-howto) :is(.about-codex-content,.privacy-ledger-content,.howto-guide-content),
html:not(.public-document-reading-disabled) :is(#view-about,#view-privacy,#view-howto) :is(.about-codex-content,.privacy-ledger-content,.howto-guide-content) {
  width:100% !important; max-width:none !important; margin-left:auto !important; margin-right:auto !important;
}
html:not(.public-document-reading-disabled) :is(#view-about,#view-privacy,#view-howto) :is(.about-codex-prologue,.privacy-ledger-prologue,.howto-guide-prologue) {
  width:100% !important; max-width:none !important;
}
html:not(.public-document-reading-disabled) :is(#view-about,#view-privacy,#view-howto) :is(.about-codex-prologue p,.privacy-ledger-prologue p,.howto-guide-prologue>p:last-child) {
  max-width:var(--article-max-width,820px); margin-left:auto; margin-right:auto;
}
html:not(.public-document-reading-disabled) :is(#view-about,#view-privacy,#view-howto) :is(.about-codex-chapter>div:not(.about-codex-chapter-head),.privacy-ledger-article>div:not(.privacy-ledger-article-heading),.howto-guide-entry>div:not(.howto-guide-entry-heading)) {
  width:100%; max-width:var(--article-max-width,820px); margin-left:auto; margin-right:auto;
}
html:not(.public-document-reading-disabled) :is(#view-about,#view-privacy,#view-howto) :is(p,li,td,th,blockquote,dt,dd,figcaption) {
  font-size:var(--article-font-size) !important; line-height:var(--article-line-height) !important; font-family:var(--article-font-family) !important;
}
@media (prefers-reduced-motion:reduce) {
  #summary-section, #summary-section * { animation:none !important; transition:none !important; }
}
</style>'''
              s = s[:start] + style + s[end+8:]
          else:
              s += style

          # Current policy edition documented by the repository's repair history.
          s = s.replace("制定: 2026/01/02 ・ 改定: 2026/08/29 (第29版) ・ 運営: nden148", "制定: 2026/01/02 ・ 改定: 2026/09/13 (第30版) ・ 運営: nden148", 1)
          s = s.replace("現行版：第29版（最終改定日：2026年8月29日）", "現行版：第30版（最終改定日：2026年9月13日）", 1)

          # Make the public documents and the passport use the same common paper/card rhythm.
          s += '''<style id="tenmei-common-ui-normalization">
/* Ver.4.0: 公開文書・参拝証・記事AI要約の共通紙面 */
:is(#view-about,#view-privacy,#view-howto,#view-auth) :is(.about-codex-content,.privacy-ledger-content,.howto-guide-content,.auth-passport-hero) {
  box-sizing:border-box;
}
:is(#view-about,#view-privacy,#view-howto) :is(.about-codex-content,.privacy-ledger-content,.howto-guide-content),
#view-auth .auth-passport-hero {
  border-radius:22px;
}
#view-auth .auth-passport-title {
  font-family:inherit !important;
  line-height:1.25 !important;
  letter-spacing:normal;
}
#summary-section {
  box-sizing:border-box;
  border:1px solid var(--line,rgba(0,0,0,.12));
  border-radius:22px;
  padding:clamp(18px,3vw,28px);
  margin-top:clamp(18px,3vw,28px);
  background:var(--paper-soft,var(--card-bg,#fff));
  box-shadow:var(--shadow-soft,0 10px 30px rgba(0,0,0,.06));
  overflow:hidden;
}
#summary-section #summarize-btn {
  min-height:44px;
  border-radius:12px;
  font:inherit;
  transition:transform 160ms cubic-bezier(.23,1,.32,1),opacity 160ms ease,background 160ms ease,border-color 160ms ease;
}
#summary-section #summarize-btn:active { transform:scale(.98); }
#summary-section #summary-result {
  margin-top:16px;
  border-radius:16px;
  overflow:hidden;
}
#summary-section[aria-busy="true"] #summarize-btn,
#summary-section .is-loading #summarize-btn { cursor:wait; opacity:.72; }
@media (prefers-reduced-motion:no-preference) {
  #summary-section { animation:tenmei-ai-card-in 420ms cubic-bezier(.23,1,.32,1) both; }
  #summary-section #summary-result { animation:tenmei-ai-result-in 320ms ease-out both; }
}
@keyframes tenmei-ai-card-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes tenmei-ai-result-in { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
@media (max-width:700px) {
  #summary-section { border-radius:18px; padding:18px; }
  #view-auth .auth-passport-hero { border-radius:18px; }
}
</style>'''
          p.write_text(s, encoding="utf-8")

          # Add a source-level contract test for this repair.
          t = Path("tests/public-document-ai-ui-regression.cjs")
          t.write_text(r'''const assert = require("node:assert/strict");
const fs = require("node:fs");
const html = fs.readFileSync("index.html","utf8");
assert(html.includes('id="tenmei-public-document-reading-complete-fix"'));
assert(html.includes("max-width:var(--article-max-width,820px)"));
assert(html.includes("class=\"auth-passport-hero\""));
assert(html.includes("class=\"auth-passport-title\""));
assert(html.includes('id="summary-section"'));
assert(html.includes('id="summarize-btn"'));
assert(html.includes('id="summary-result"'));
assert(html.includes("tenmei-ai-card-in"));
assert(html.includes("prefers-reduced-motion:reduce"));
console.log("public document / passport / article AI UI repair contract passed");
''', encoding="utf-8")

      - name: Validate and commit
        run: |
          node --check tests/public-document-ai-ui-regression.cjs
          node tests/public-document-ai-ui-regression.cjs
          node tests/about-ui-regression.cjs
          node tests/privacy-ui-regression.cjs
          node tests/howto-ui-regression.cjs
          node tests/news-ui-regression.cjs
          node tests/column-ui-regression.cjs
          node tests/auth-ui-regression.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-ui-repair.yml
          git add index.html tests/public-document-ai-ui-regression.cjs .github/workflows/one-shot-ui-repair.yml
          git commit -m "fix: unify public documents and AI UI"
          git push
