name: Discord Notify on Push

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  notify:
    if: github.event.head_commit.message != 'fix: apply timezone persistence and privacy version'
    runs-on: ubuntu-latest
    steps:
      - name: Discordへ更新通知を送る
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const commit = context.payload.head_commit;
            const message = commit?.message?.split('\n')[0] || '更新されました';
            const body = { embeds: [{ title: '📢 天命乃杜 サイト更新のお知らせ', description: '天命乃杜のサイトが更新されました。', color: 0xc5a059, fields: [{ name: '更新内容', value: message, inline: false }, { name: '参拝はこちら', value: 'https://tenmei-mori.pages.dev/', inline: false }], footer: { text: '天命乃杜' }, timestamp: new Date().toISOString() }] };
            await fetch(webhook, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  repair:
    if: github.event.head_commit.message != 'fix: apply timezone persistence and privacy version' && github.event.head_commit.message != 'chore: run timezone privacy repair from stable workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair timezone and privacy version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Persist the selected timezone through AppConfig, not only a mutable local object.
          old = "            settings.timeZone = next;\n            if (window.localStorage) {\n                try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}\n            }"
          new = """            if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
                window.__tenmeiTimeZonePersisting = true;
                try { AppConfig.toggle('timeZone', next); }
                finally { window.__tenmeiTimeZonePersisting = false; }
            } else {
                settings.timeZone = next;
            }
            try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "settings.timeZone = next;" not in s:
              raise SystemExit('timezone setter not found')
          else:
              s = s.replace("            settings.timeZone = next;", new, 1)

          # 2) Remove hard-coded Tokyo from dynamic date-key generation.
          s = s.replace("return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');", "return new Date().toLocaleDateString('ja-JP', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');", 1)
          s = s.replace("welcomeDate.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;", "const welcomeParts = window.TenmeiTime && typeof window.TenmeiTime.getDateParts === 'function' ? window.TenmeiTime.getDateParts(now) : { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() }; const welcomeWeekday = window.TenmeiTime && typeof window.TenmeiTime.getTimeZone === 'function' ? new Intl.DateTimeFormat('ja-JP', { timeZone: window.TenmeiTime.getTimeZone(), weekday: 'short' }).format(now) : days[now.getDay()]; welcomeDate.textContent = `${welcomeParts.year}年${welcomeParts.month}月${welcomeParts.day}日 (${welcomeWeekday})`;", 1)
          s = s.replace("var todayKey = new Date().toISOString().slice(0,10);", "var todayKey = window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10);", 1)
          s = s.replace("var fridayKey = 'tenmei_friday13_' + new Date().toISOString().slice(0,10);", "var fridayKey = 'tenmei_friday13_' + (window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10));", 1)
          s = s.replace("return new Date(`${key}T00:00:00`);", "return new Date(`${key}T00:00:00Z`);", 1)

          # 3) Normalize the privacy policy edition. The current edition is the 28th edition (2026-08-28).
          s = s.replace('現行版：第18版（最終改定日：2026年8月14日）', '現行版：第28版（最終改定日：2026年8月28日)')
          s = s.replace('現行版：第30版（最終改定日：2026年9月13日）', '現行版：第28版（最終改定日：2026年8月28日）')
          s = s.replace('現行版：第28版（最終改定日：2026年8月28日)', '現行版：第28版（最終改定日：2026年8月28日）')
          if '現行版：第28版（最終改定日：2026年8月28日）' not in s:
              raise SystemExit('privacy edition marker missing')

          p.write_text(s, encoding='utf-8')

          # Regression test marker follows the same edition.
          t = Path('tests/public-document-regression.cjs')
          if t.exists():
              ts = t.read_text(encoding='utf-8')
              ts = ts.replace('現行版：第18版（最終改定日：2026年8月14日）', '現行版：第28版（最終改定日：2026年8月28日）')
              ts = ts.replace('現行版：第30版（最終改定日：2026年9月13日）', '現行版：第28版（最終改定日：2026年8月28日）')
              t.write_text(ts, encoding='utf-8')
          PY
          node --check tests/public-document-regression.cjs
          node tests/public-document-regression.cjs
      - name: Commit fix and remove repair job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/notify-discord.yml')
          s=p.read_text(encoding='utf-8')
          marker='\n  repair:\n'
          i=s.find(marker)
          if i >= 0:
              s=s[:i]+'\n'
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply timezone persistence and privacy version'
          git push
