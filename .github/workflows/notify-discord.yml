name: Discord Notify on Push

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discordへ更新通知を送る
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const commit = context.payload.head_commit;
            const message = commit?.message?.split('\n')[0] || '更新されました';

            const body = {
              embeds: [{
                title: '📢 天命乃杜 サイト更新のお知らせ',
                description: '天命乃杜のサイトが更新されました。',
                color: 0xc5a059,
                fields: [
                  {
                    name: '更新内容',
                    value: message,
                    inline: false
                  },
                  {
                    name: '参拝はこちら',
                    value: 'https://tenmei-mori.pages.dev/',
                    inline: false
                  }
                ],
                footer: { text: '天命乃杜' },
                timestamp: new Date().toISOString()
              }]
            };

            await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });

  apply-site-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply outstanding site fixes
        run: |
          if [ -f tools/complete_site_fixes.py ]; then
            python3 tools/complete_site_fixes.py
          else
            echo 'No pending one-shot patch script.'
          fi
      - name: Validate changed site
        run: |
          if [ -f tests/public-document-reading-regression.cjs ]; then
            node --check tests/public-document-reading-regression.cjs
            node tests/public-document-reading-regression.cjs
          fi
          node --check tests/privacy-ui-regression.cjs
          node --check tests/howto-ui-regression.cjs
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: complete outstanding site fixes'
          git push
