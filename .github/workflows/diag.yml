name: Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diag:
    if: github.event.head_commit.message != 'chore: remove diagnostic workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '=== TZ MATCHES ==='
          grep -n -i -E 'timezone|time-zone|タイムゾーン|IANA|timeZone' index.html | head -n 180 || true
          echo '=== DATE/TIME MATCHES ==='
          grep -n -E 'Intl\.DateTimeFormat|toLocale(Date|String)|getFullYear|getMonth|getDate|getDay|getHours|Date\.now|new Date\(' index.html | head -n 400 || true
          echo '=== APP CONFIG MATCHES ==='
          grep -n -E 'AppConfig|timezone|timeZone' index.html | head -n 400 || true
