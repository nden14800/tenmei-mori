name: Diagnose timezone implementation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore: remove timezone diagnostic workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect timezone code
        run: |
          set -eu
          echo '=== timezone-related lines ==='
          grep -n -i -E 'timezone|time-zone|タイムゾーン|IANA|timeZone' index.html | head -n 120 || true
          echo '=== AppConfig-related lines ==='
          grep -n -i -E 'AppConfig|timezone|timeZone' index.html | head -n 260 || true
          echo '=== likely preference/date helpers ==='
          grep -n -E 'function (format|today|date|time|now|get.*Date|get.*Time)|toLocale(Date|String)|Intl\.DateTimeFormat|Date\.now|new Date\(' index.html | head -n 320 || true
