name: Repair timezone control and force production source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    # Make one repair commit, then remove this temporary workflow so it cannot loop.
    if: github.event.head_commit.message != 'fix: repair timezone control and production source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair timezone persistence and add build marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          # The timezone selector must go through the canonical settings layer.
          if "AppConfig.toggle('timeZone', next)" not in s:
              candidates = [
                  'settings.timeZone = next;',
                  '            settings.timeZone = next;',
              ]
              persistence = """if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
                  window.__tenmeiTimeZonePersisting = true;
                  try { AppConfig.toggle('timeZone', next); }
                  finally { window.__tenmeiTimeZonePersisting = false; }
              } else {
                  settings.timeZone = next;
              }
              try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}"""
              for old in candidates:
                  if old in s:
                      s = s.replace(old, persistence, 1)
                      changed = True
                      break
              else:
                  raise SystemExit('Timezone setter could not be located; refusing to make an unsafe blind edit.')

          # Ensure the date key follows the selected timezone, not a hard-coded Tokyo/UTC key.
          old = "return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');"
          new = "return new Date().toLocaleDateString('ja-JP', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "var todayKey = new Date().toISOString().slice(0,10);"
          new = "var todayKey = window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10);"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "var fridayKey = 'tenmei_friday13_' + new Date().toISOString().slice(0,10);"
          new = "var fridayKey = 'tenmei_friday13_' + (window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10));"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = "return new Date(`${key}T00:00:00`);"
          new = "return new Date(`${key}T00:00:00Z`);"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          # Make the deployment source visibly unique so a Pages build cannot reuse an old artifact.
          stamp = datetime.now(timezone.utc).isoformat(timespec='seconds')
          marker = '<meta name="tenmei-build" content="'
          if marker in s:
              updated = re.sub(r'<meta name="tenmei-build" content="[^"]*"\s*/?>', f'<meta name="tenmei-build" content="{stamp}" />', s, count=1)
              changed = changed or updated != s
              s = updated
          else:
              head = s.find('</head>')
              if head < 0:
                  raise SystemExit('index.html has no </head>; refusing unsafe deployment edit')
              s = s[:head] + f'<meta name="tenmei-build" content="{stamp}" />\n' + s[head:]
              changed = True

          p.write_text(s, encoding='utf-8')
          print(f'index.html repaired; changed={changed}')
          PY

      - name: Add regression check
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/timezone-control-regression.cjs <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync(path.resolve(__dirname, '..', 'index.html'), 'utf8');
          assert(html.includes("AppConfig.toggle('timeZone', next)"), 'timezone selector must persist through AppConfig.toggle');
          assert(html.includes('tenmei_timezone_setting'), 'timezone selector must have a browser persistence fallback');
          assert(html.includes('getTimeZone()'), 'date generation must use the selected timezone');
          assert(html.includes('name="tenmei-build"'), 'production build marker is missing');
          console.log('timezone control regression passed');
          JS
          node --check tests/timezone-control-regression.cjs
          node tests/timezone-control-regression.cjs

      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-timezone-and-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/timezone-control-regression.cjs .github/workflows/repair-timezone-and-production.yml
          git commit -m 'fix: repair timezone control and production source'
          git push
