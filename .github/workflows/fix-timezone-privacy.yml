name: Timezone Privacy Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          old = "settings.timeZone = next;"
          new = """if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
                window.__tenmeiTimeZonePersisting = true;
                try { AppConfig.toggle('timeZone', next); }
                finally { window.__tenmeiTimeZonePersisting = false; }
            } else {
                settings.timeZone = next;
            }
            try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}"""
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          replacements = [
              ("return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');", "return new Date().toLocaleDateString('ja-JP', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');"),
              ("var todayKey = new Date().toISOString().slice(0,10);", "var todayKey = window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10);"),
              ("var fridayKey = 'tenmei_friday13_' + new Date().toISOString().slice(0,10);", "var fridayKey = 'tenmei_friday13_' + (window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10));"),
              ("return new Date(`${key}T00:00:00`);", "return new Date(`${key}T00:00:00Z`);")
          ]
          for a, b in replacements:
              if a in s:
                  s = s.replace(a, b, 1)
                  changed = True

          old_welcome = "welcomeDate.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;"
          new_welcome = "const welcomeParts = window.TenmeiTime && typeof window.TenmeiTime.getDateParts === 'function' ? window.TenmeiTime.getDateParts(now) : { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() }; const welcomeWeekday = window.TenmeiTime && typeof window.TenmeiTime.getTimeZone === 'function' ? new Intl.DateTimeFormat('ja-JP', { timeZone: window.TenmeiTime.getTimeZone(), weekday: 'short' }).format(now) : days[now.getDay()]; welcomeDate.textContent = `${welcomeParts.year}年${welcomeParts.month}月${welcomeParts.day}日 (${welcomeWeekday})`;"
          if old_welcome in s:
              s = s.replace(old_welcome, new_welcome, 1)
              changed = True

          s = s.replace('現行版：第18版（最終改定日：2026年8月14日）', '現行版：第28版（最終改定日：2026年8月28日）')
          s = s.replace('現行版：第30版（最終改定日：2026年9月13日）', '現行版：第28版（最終改定日：2026年8月28日）')
          if '現行版：第28版（最終改定日：2026年8月28日）' not in s:
              raise SystemExit('privacy edition marker missing')

          p.write_text(s, encoding='utf-8')

          t = Path('tests/public-document-regression.cjs')
          if t.exists():
              ts = t.read_text(encoding='utf-8')
              ts = ts.replace('現行版：第18版（最終改定日：2026年8月14日）', '現行版：第28版（最終改定日：2026年8月28日）')
              ts = ts.replace('現行版：第30版（最終改定日：2026年9月13日）', '現行版：第28版（最終改定日：2026年8月28日）')
              t.write_text(ts, encoding='utf-8')
          print('patch changed:', changed)
          PY

      - name: Validate
        run: |
          node --check tests/public-document-regression.cjs
          node --check tests/howto-ui-regression.cjs
          node tests/public-document-regression.cjs

      - name: Commit fixes and clean temporary workflows
        run: |
          rm -f .github/workflows/fix-timezone-privacy.yml .github/workflows/timezone-repair-once.yml .github/workflows/diag.yml .github/workflows/run-complete-site-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No site changes detected; cleanup only.'
            exit 0
          fi
          git commit -m 'fix: timezone and privacy policy edition'
          git push
