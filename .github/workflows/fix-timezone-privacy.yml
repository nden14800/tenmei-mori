name: Timezone Privacy Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose current edition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<section id="view-privacy"[\s\S]*?</section>\s*<!-- サイトフッター', s)
          section = m.group(0) if m else s
          print('--- PRIVACY EDITION MARKERS ---')
          for line in section.splitlines():
              if '第' in line and '版' in line:
                  print(line.strip())
          print('--- ALL EDITION TOKENS ---')
          print(sorted(set(re.findall(r'第\d+版', section))))
          PY
          exit 1
