name: Timezone Privacy Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "settings.timeZone = next;" in s:
              s=s.replace("settings.timeZone = next;", """if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
                window.__tenmeiTimeZonePersisting = true;
                try { AppConfig.toggle('timeZone', next); }
                finally { window.__tenmeiTimeZonePersisting = false; }
            } else {
                settings.timeZone = next;
            }
            try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}""", 1)
          for a,b in [
            ("return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');", "return new Date().toLocaleDateString('ja-JP', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');"),
            ("var todayKey = new Date().toISOString().slice(0,10);", "var todayKey = window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10);"),
            ("var fridayKey = 'tenmei_friday13_' + new Date().toISOString().slice(0,10);", "var fridayKey = 'tenmei_friday13_' + (window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10));"),
            ("return new Date(`${key}T00:00:00`);", "return new Date(`${key}T00:00:00Z`)")
          ]:
              if a in s: s=s.replace(a,b,1)
          old="welcomeDate.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;"
          new="const welcomeParts = window.TenmeiTime && typeof window.TenmeiTime.getDateParts === 'function' ? window.TenmeiTime.getDateParts(now) : { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() }; const welcomeWeekday = window.TenmeiTime && typeof window.TenmeiTime.getTimeZone === 'function' ? new Intl.DateTimeFormat('ja-JP', { timeZone: window.TenmeiTime.getTimeZone(), weekday: 'short' }).format(now) : days[now.getDay()]; welcomeDate.textContent = `${welcomeParts.year}年${welcomeParts.month}月${welcomeParts.day}日 (${welcomeWeekday})`;"
          if old in s:s=s.replace(old,new,1)
          # Correct current privacy header from the actual source text.
          s=s.replace('制定: 2026/01/02 ・ 改定: 2026/09/13 (第30版) ・ 運営: nden148','制定: 2026/01/02 ・ 改定: 2026/08/29 (第29版) ・ 運営: nden148',1)
          s=s.replace('現行版：第30版（最終改定日：2026年9月13日）','現行版：第29版（最終改定日：2026年8月29日）',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify repaired source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<section id="view-privacy"[\s\S]*?</section>',s)
          section=m.group(0) if m else s
          checks={
            'timezone_appconfig': "AppConfig.toggle('timeZone', next)" in s,
            'timezone_storage': 'tenmei_timezone_setting' in s,
            'timezone_date_key': 'TenmeiTime.getDateKey' in s,
            'privacy_header_29': bool(re.search(r'改定:\s*2026/08/29\s*\(第29版\)',section)),
            'privacy_current_29': '現行版：第29版（最終改定日：2026年8月29日）' in section,
            'old_current_30_absent': '現行版：第30版（最終改定日：2026年9月13日）' not in section,
          }
          print(checks)
          assert all(checks.values()), checks
          print('timezone/privacy repair verification passed')
          PY
      - name: Commit fixes and cleanup
        run: |
          rm -f .github/workflows/fix-timezone-privacy.yml .github/workflows/timezone-repair-once.yml .github/workflows/diag.yml .github/workflows/run-complete-site-fixes.yml .github/workflows/complete-sept13-site-fixes.yml tools/timezone-privacy-repair-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: timezone setting and privacy policy edition 29'
          git push
