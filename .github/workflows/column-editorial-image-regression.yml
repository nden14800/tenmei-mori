name: Column native visual regression
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/js/column-editorial-visuals.js"
      - "functions/_middleware.js"
      - "_headers"
      - "tests/column-*-regression.cjs"
      - "tests/static-asset-paths-regression.cjs"
      - ".github/workflows/column-editorial-image-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/js/column-editorial-visuals.js"
      - "functions/_middleware.js"
      - "_headers"
      - "tests/column-*-regression.cjs"
      - "tests/static-asset-paths-regression.cjs"
      - ".github/workflows/column-editorial-image-regression.yml"
  workflow_dispatch:
jobs:
  column-image-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check native visual script syntax
        run: node --check assets/js/column-editorial-visuals.js
      - name: Test article-native HTML/CSS visuals
        run: node tests/column-image-regression.cjs
