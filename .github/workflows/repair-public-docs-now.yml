name: Repair public documents now

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair privacy edition and reading settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          # Current privacy policy is the policy changed in the 2026-09-13 fix commit.
          s = s.replace('制定: 2026/01/02 ・ 改定: 2026/08/29 (第29版) ・ 運営: nden148', '制定: 2026/01/02 ・ 改定: 2026/09/13 (第30版) ・ 運営: nden148', 1)
          s = s.replace('現行版：第29版（最終改定日：2026年8月29日）', '現行版：第30版（最終改定日：2026年9月13日）', 1)

          style_id = '<style id="tenmei-public-document-reading-complete-fix">'
          start = s.find(style_id)
          if start < 0:
              raise SystemExit('public reading style block not found')
          end = s.find('</style>', start)
          if end < 0:
              raise SystemExit('public reading style block end not found')
          new_style = '''<style id="tenmei-public-document-reading-complete-fix">
/* 公開文書は記事と同じく、外側のカード/フレームを常に全幅に保ち、読書幅はカード内の本文領域だけへ適用する。 */
html:is(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content),
html:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content) {
    width: 100% !important;
    max-width: none !important;
    margin-left: auto !important;
    margin-right: auto !important;
}
html:not(.public-document-reading-disabled) #view-about .about-codex-chapter > div:not(.about-codex-chapter-head),
html:not(.public-document-reading-disabled) #view-privacy .privacy-ledger-article > div:not(.privacy-ledger-article-heading),
html:not(.public-document-reading-disabled) #view-howto .howto-guide-entry > div:not(.howto-guide-entry-heading) {
    width: 100%;
    max-width: var(--article-max-width, 820px);
    margin-left: auto;
    margin-right: auto;
}
html:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-prologue, .privacy-ledger-prologue, .howto-guide-prologue) {
    width: 100% !important;
    max-width: none !important;
}
html:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-prologue p, .privacy-ledger-prologue p, .howto-guide-prologue > p:last-child) {
    max-width: var(--article-max-width, 820px);
    margin-left: auto;
    margin-right: auto;
}
html:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(p, li, td, th, blockquote, dt, dd, figcaption) {
    font-size: var(--article-font-size) !important;
    line-height: var(--article-line-height) !important;
    font-family: var(--article-font-family) !important;
}
@media print {
    :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content) {
        width: 100% !important;
        max-width: none !important;
    }
}
</style>'''
          s = s[:start] + new_style + s[end+8:]

          # Add the real 29th/30th snapshots to the document-history archive when absent.
          hp = Path('assets/data/public-document-history.json')
          data = json.loads(hp.read_text(encoding='utf-8'))
          data['generatedAt'] = '2026-09-14T07:20:00+09:00'
          versions = data.setdefault('documents', {}).setdefault('privacy', {}).setdefault('versions', [])

          def extract_privacy(html):
              begin = html.find('<section id="view-privacy"')
              if begin < 0:
                  raise ValueError('view-privacy not found')
              token = re.compile(r'</?section\b[^>]*>', re.I)
              depth = 0
              for m in token.finditer(html, begin):
                  if m.group(0).lower().startswith('</section'):
                      depth -= 1
                      if depth == 0:
                          return html[begin:m.end()]
                  elif not m.group(0).rstrip().endswith('/>'):
                      depth += 1
              raise ValueError('privacy section end not found')

          current_snapshot = extract_privacy(s)
          prior_sha = '1757fd7cb2e2aafcfa0a65b7134d7a5160e1e4c1'
          prior = __import__('subprocess').check_output(['git','show',prior_sha+':index.html'], text=True)
          prior_snapshot = extract_privacy(prior)

          def by_edition(n):
              for item in versions:
                  if str(item.get('edition')) == str(n):
                      return item
              return None

          v30 = by_edition(30)
          if v30 is None:
              versions.append({
                  'id':'privacy-30-20260913',
                  'signature':'privacy-revision-30-20260913',
                  'edition':30,
                  'revisedLabel':'2026/09/13 (第30版)',
                  'availability':'snapshot',
                  'commit':{'sha':'c207b63dd2f687d0c1c3586a6214e8c1821ca6a3','shortSha':'c207b63','date':'2026-09-13T12:40:40Z','subject':'fix: complete outstanding site fixes'},
                  'html':current_snapshot
              })
          else:
              v30['revisedLabel']='2026/09/13 (第30版)'
              v30['availability']='snapshot'
              v30['commit']={'sha':'c207b63dd2f687d0c1c3586a6214e8c1821ca6a3','shortSha':'c207b63','date':'2026-09-13T12:40:40Z','subject':'fix: complete outstanding site fixes'}
              v30['html']=current_snapshot

          v29 = by_edition(29)
          if v29 is None:
              versions.append({
                  'id':'privacy-29-20260829',
                  'signature':'privacy-revision-29-20260829',
                  'edition':29,
                  'revisedLabel':'2026/08/29 (第29版)',
                  'availability':'snapshot',
                  'commit':{'sha':prior_sha,'shortSha':'1757fd7','date':'2026-08-29T00:00:00Z','subject':'第30版改定直前のプライバシーポリシー'},
                  'html':prior_snapshot
              })
          else:
              v29['revisedLabel']='2026/08/29 (第29版)'
              if not v29.get('html') or 'document-history-missing-record' in v29.get('html',''):
                  v29['availability']='snapshot'
                  v29['commit']={'sha':prior_sha,'shortSha':'1757fd7','date':'2026-08-29T00:00:00Z','subject':'第30版改定直前のプライバシーポリシー'}
                  v29['html']=prior_snapshot

          versions.sort(key=lambda item: int(item.get('edition', 0)), reverse=True)
          hp.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          index.write_text(s, encoding='utf-8')
          PY

          cat > tests/public-document-reading-regression.cjs <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync(path.resolve(__dirname, '..', 'index.html'), 'utf8');
          assert.equal((html.match(/id="settings-public-documents-toggle"/g) || []).length, 1);
          assert(html.includes("AppConfig.toggle('publicDocumentReading', this.checked)"));
          assert(html.includes('html:is(.public-document-reading-disabled)'));
          assert(html.includes('max-width: none !important;'));
          assert(html.includes('about-codex-chapter > div:not(.about-codex-chapter-head)'));
          assert(html.includes('privacy-ledger-article > div:not(.privacy-ledger-article-heading)'));
          assert(html.includes('howto-guide-entry > div:not(.howto-guide-entry-heading)'));
          assert(!html.includes(':is(.about-codex-content, .privacy-ledger-content, .howto-guide-content, article, .article-content) {\n    max-width: var(--article-max-width) !important;'));
          console.log('public document reading regression passed');
          JS

          node --check tests/public-document-reading-regression.cjs
          node tests/public-document-reading-regression.cjs
          node --check tests/home-article-layout-regression.cjs
          grep -q '制定: 2026/01/02 ・ 改定: 2026/09/13 (第30版) ・ 運営: nden148' index.html
          grep -q '現行版：第30版（最終改定日：2026年9月13日）' index.html
          ! grep -q '現行版：第29版（最終改定日：2026年8月29日）' index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-public-docs-now.yml .github/workflows/fix-privacy-reading-0914.yml
          # Restore notify-discord.yml to a notify-only workflow by removing the temporary repair job if present.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/notify-discord.yml')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              marker='\n  repair:\n'
              i=s.find(marker)
              if i >= 0:
                  s=s[:i]+'\n  notify:' + s[s.find('\n  notify:', i):].split('\n  notify:',1)[1] if '\n  notify:' in s[i:] else s[:i]+'\n'
                  # Simpler: rewrite to the canonical notify-only workflow.
                  s='''name: Discord Notify on Push\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  notify:\n    runs-on: ubuntu-latest\n    continue-on-error: true\n    steps:\n      - name: Discordへ更新通知を送る\n        uses: actions/github-script@v7\n        env:\n          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}\n        with:\n          script: |\n            const webhook = process.env.DISCORD_WEBHOOK;\n            if (!webhook) return;\n            const commit = context.payload.head_commit;\n            const message = commit?.message?.split('\\n')[0] || '更新されました';\n            const body = { embeds: [{ title: '📢 天命乃杜 サイト更新のお知らせ', description: '天命乃杜のサイトが更新されました。', color: 0xc5a059, fields: [{ name: '更新内容', value: message, inline: false }, { name: '参拝はこちら', value: 'https://tenmei-mori.pages.dev/', inline: false }], footer: { text: '天命乃杜' }, timestamp: new Date().toISOString() }] };\n            await fetch(webhook, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });\n'''
                  p.write_text(s,encoding='utf-8')
          PY
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'fix: repair privacy edition and public reading settings'
          git push
