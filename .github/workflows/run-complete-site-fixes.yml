name: Run complete site fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: complete outstanding site fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 tools/complete_site_fixes.py
      - name: Validate
        run: |
          node --check tests/public-document-reading-regression.cjs
          node tests/public-document-reading-regression.cjs
          node --check tests/privacy-ui-regression.cjs
          node --check tests/howto-ui-regression.cjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md tests/privacy-ui-regression.cjs tests/public-document-reading-regression.cjs .github/workflows/run-complete-site-fixes.yml
          git rm --cached tools/complete_site_fixes.py 2>/dev/null || true
          git add -u tools/complete_site_fixes.py
          git commit -m 'fix: complete outstanding site fixes'
          git push
