name: Service browser monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/service-browser-monitor.yml'
      - 'tests/status-browser-monitor.cjs'
      - 'tests/publish-health-history.cjs'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-browser-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and API checks
        run: node tests/status-browser-monitor.cjs
        continue-on-error: true
      - name: Update uptime history and incidents
        run: node tests/publish-health-history.cjs
      - name: Publish health snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/public/health.json status/health-history.json
          if git diff --cached --quiet; then
            echo "Health snapshot unchanged."
            exit 0
          fi
          git commit -m "chore(status): update browser health snapshot"
          # A maintainer commit may land while this scheduled job is running.
          # Rebase the generated snapshot commit onto the newest main before pushing.
          git pull --rebase origin main
          git push
