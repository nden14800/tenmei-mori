name: Service browser monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/service-browser-monitor.yml'
      - 'tests/status-browser-monitor.cjs'
      - 'tests/publish-health-history.cjs'
      - 'status/src/pages/StatusPage.tsx'
      - 'status/src/components/BrowserHealthNotice.tsx'
      - 'status/src/components/MonitorCard.tsx'
      - 'status/src/components/MonitorDetails.tsx'
      - 'status/src/lib/monitorTimeline.ts'
  schedule:
    # Keep away from minute 0 (GitHub documents elevated schedule delays at hour boundaries).
    # A cron-expression change also reactivates a schedule if GitHub has disabled it.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-browser-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Keep a single slow/hung run from blocking many subsequent five-minute checks.
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.55.0-v1
      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser and API checks
        if: always()
        run: node tests/status-browser-monitor.cjs
        continue-on-error: true
        timeout-minutes: 4
      - name: Prevent stale snapshot from masquerading as a current check
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'status/public/health.json';
          let data = null;
          try { data = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          const checkedAt = Date.parse(data?.checkedAt || '');
          const fresh = Number.isFinite(checkedAt) && Date.now() - checkedAt >= -60000 && Date.now() - checkedAt <= 10 * 60 * 1000;
          if (!fresh) {
            const now = new Date().toISOString();
            fs.mkdirSync('status/public', { recursive: true });
            fs.writeFileSync(path, JSON.stringify({
              schemaVersion: 2,
              checkedAt: now,
              stateChangedAt: now,
              overall: { state: 'unknown', detail: '監視処理が完了せず、最新の実ブラウザ確認結果を取得できませんでした。' },
              components: {
                site: { state: 'unknown', detail: '実ブラウザ監視の完了を確認できません。' },
                api: { state: 'unknown', detail: '監視処理が完了しませんでした。' },
                omikuji: { state: 'unknown', detail: 'おみくじ操作の最新結果は未確認です。' },
                ai: { state: 'external', detail: '外部AIサービスのため、この監視システムでは可用性を判定していません。' }
              },
              probes: {}
            }, null, 2) + '\\n');
            console.error('Published an explicit unknown state instead of leaving a stale health snapshot.');
          }
          NODE
      - name: Update uptime history and incidents
        if: always()
        run: node tests/publish-health-history.cjs
      - name: Publish health snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/public/health.json status/health-history.json status/public/health-history.json
          if git diff --cached --quiet; then
            echo "Health snapshot unchanged."
            exit 0
          fi
          git commit -m "chore(status): update browser health snapshot"
          # A maintainer commit may land while this scheduled job is running.
          # Rebase the generated snapshot commit onto the newest main before pushing.
          git pull --rebase --autostash origin main
          git push
