name: Apply production timezone fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair production timezone persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        run: python3 scripts/repair-production-timezone.py

      - name: Validate
        run: |
          grep -q 'tenmei-production-timezone-persistence-fix' index.html
          grep -q "AppConfig.toggle('timeZone'" index.html
          grep -q 'tenmei_timezone_setting' index.html

      - name: Commit and trigger Pages
        run: |
          rm -f .github/workflows/apply-production-timezone-fix.yml
          printf '%s\n%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'Production timezone persistence fix applied; trigger a fresh Cloudflare Pages deployment.' > .cloudflare-pages-deploy-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .cloudflare-pages-deploy-trigger
          git add -u .github/workflows/apply-production-timezone-fix.yml
          git commit -m 'fix: repair production timezone persistence'
          git push
