name: Fix timezone persistence and force production redeploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair timezone persistence and force production redeploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair timezone setting and add production build marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from datetime import datetime, timezone

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Persist the selected timezone through the app's canonical config layer.
          if "AppConfig.toggle('timeZone', next)" not in s:
              target = "settings.timeZone = next;"
              if target not in s:
                  raise SystemExit('timezone setter target not found')
              replacement = """if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function' && !window.__tenmeiTimeZonePersisting) {
                  window.__tenmeiTimeZonePersisting = true;
                  try { AppConfig.toggle('timeZone', next); }
                  finally { window.__tenmeiTimeZonePersisting = false; }
              } else {
                  settings.timeZone = next;
              }
              try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}"""
              s = s.replace(target, replacement, 1)

          # Make date-key generation follow the selected timezone instead of hard-coded Tokyo.
          s = s.replace(
              "return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');",
              "return new Date().toLocaleDateString('ja-JP', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');",
              1,
          )

          s = s.replace(
              "var todayKey = new Date().toISOString().slice(0,10);",
              "var todayKey = window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10);",
              1,
          )
          s = s.replace(
              "var fridayKey = 'tenmei_friday13_' + new Date().toISOString().slice(0,10);",
              "var fridayKey = 'tenmei_friday13_' + (window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10));",
              1,
          )
          s = s.replace(
              "return new Date(`${key}T00:00:00`);",
              "return new Date(`${key}T00:00:00Z`);",
              1,
          )

          # A real index.html change guarantees that the GitHub -> Cloudflare Pages
          # production integration receives a new build instead of reusing the old one.
          stamp = datetime.now(timezone.utc).isoformat(timespec='seconds')
          marker = '<meta name="tenmei-build" content="'
          if marker in s:
              s = re.sub(r'<meta name="tenmei-build" content="[^"]*"\s*/?>', f'<meta name="tenmei-build" content="{stamp}" />', s, count=1)
          else:
              head = s.find('</head>')
              if head == -1:
                  raise SystemExit('head closing tag not found')
              s = s[:head] + f'<meta name="tenmei-build" content="{stamp}" />\n' + s[head:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AppConfig.toggle('timeZone', next)" index.html
          grep -q "tenmei_timezone_setting" index.html
          grep -q 'tenmei-build' index.html
          echo 'timezone persistence contract passed'

      - name: Commit repaired production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: repair timezone persistence and force production redeploy'
          git push
