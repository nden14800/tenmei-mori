name: Uptime CI

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".upptimerc.yml"
      - ".github/workflows/upptime-uptime.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
      - name: Publish browser incident details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("monitoring/browser-status.json", "utf8"));
          const title = "🛑 天命乃杜 ブラウザ機能監視 is down";
          const state = data.status === "UP" ? "up" : "down";

          const { execFileSync } = require("child_process");
          let issueNumber = "";
          try {
            issueNumber = execFileSync(
              "gh",
              [
                "issue",
                "list",
                "--state",
                "open",
                "--limit",
                "30",
                "--json",
                "number,title",
                "--jq",
                `.[] | select(.title == ${JSON.stringify(title)}) | .number`
              ],
              { encoding: "utf8" }
            ).trim().split("\n")[0] || "";
          } catch (error) {
            console.error("GitHub Issue lookup failed:", error.message);
            process.exit(0);
          }

          if (!issueNumber) {
            console.log("No open browser incident found.");
            process.exit(0);
          }

          if (state === "up") {
            const body = [
              "## 復旧確認",
              "",
              `ブラウザ機能監視で復旧を確認しました。`,
              "",
              `- 復旧確認時刻: ${data.checkedAt}`,
              `- 状態: ${data.status}`,
              `- 詳細: ${data.message}`,
              "",
              "Upptime本体の監視処理により、このインシデントは自動的に解決済みになります。"
            ].join("\n");
            fs.writeFileSync("/tmp/browser-incident-recovery.md", body);
            execFileSync(
              "gh",
              ["issue", "comment", issueNumber, "--body-file", "/tmp/browser-incident-recovery.md"],
              { stdio: "inherit" }
            );
            process.exit(0);
          }

          const failures = Array.isArray(data.failureDetails) && data.failureDetails.length
            ? data.failureDetails.map(
                (item) => `- **${item.check}**: ${item.message}`
              )
            : ["- 詳細な失敗情報は監視ログを確認してください。"];

          const body = [
            "## ブラウザ監視による障害詳細",
            "",
            `ブラウザ実行監視で障害を検知しています。HTTP 200でもJavaScript実行時エラーや画面遷移不良を検出した場合はDOWNとして扱います。`,
            "",
            `- 検知時刻: ${data.checkedAt}`,
            `- 状態: ${data.status}`,
            `- 概要: ${data.message}`,
            "",
            "### 検出内容",
            "",
            ...failures,
            "",
            "### 監視データ",
            "",
            "monitoring/browser-status.json に最新の監視結果を保存しています。"
          ].join("\n");

          fs.writeFileSync("/tmp/browser-incident.md", body);
          try {
            execFileSync(
              "gh",
              ["issue", "edit", issueNumber, "--body-file", "/tmp/browser-incident.md"],
              { stdio: "inherit" }
            );
          } catch (error) {
            console.error("GitHub Issue detail update failed:", error.message);
          }
          NODE
      - name: Remove simulated test incident
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'cleanup simulated incident') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/nden14800/tenmei-mori/issues/26
