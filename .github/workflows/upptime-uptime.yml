name: Uptime CI

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".upptimerc.yml"
      - ".github/workflows/upptime-uptime.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
