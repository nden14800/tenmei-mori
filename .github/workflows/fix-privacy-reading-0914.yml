name: Repair privacy edition and public document reading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair privacy edition and public reading settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Current privacy policy: the actual 9/13 policy-content change is the current edition.
          s=s.replace('制定: 2026/01/02 ・ 改定: 2026/08/29 (第29版) ・ 運営: nden148', '制定: 2026/01/02 ・ 改定: 2026/09/13 (第30版) ・ 運営: nden148', 1)
          s=s.replace('現行版：第29版（最終改定日：2026年8月29日）', '現行版：第30版（最終改定日：2026年9月13日）', 1)

          # Replace the previous broad public-document max-width override with article-like inner-width behavior.
          start=s.find('<style id="tenmei-public-document-reading-complete-fix">')
          if start == -1:
              raise SystemExit('reading fix block not found')
          end=s.find('</style>', start)
          if end == -1:
              raise SystemExit('reading fix style end not found')
          old=s[start:end+8]
          new='''<style id="tenmei-public-document-reading-complete-fix">\n/* 公開文書は記事と同じく、外側のカード/フレームは常に100%。幅設定は本文カラムだけに適用する。 */\nhtml:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content) {\n    width: 100% !important;\n    max-width: none !important;\n    margin-left: auto !important;\n    margin-right: auto !important;\n}\nhtml:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content) :is(p, li, td, th, blockquote, dt, dd, figcaption) {\n    font-size: var(--article-font-size) !important;\n    line-height: var(--article-line-height) !important;\n    font-family: var(--article-font-family) !important;\n}\nhtml.public-document-reading-disabled :is(#view-about, #view-privacy, #view-howto) [data-reading-settings-inline="true"] {\n    font-size: revert;\n    line-height: revert;\n    font-family: revert;\n}\nhtml:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) [data-public-reading-body] {\n    width: 100%;\n    max-width: var(--article-max-width, 820px);\n    margin-left: auto;\n    margin-right: auto;\n}\nhtml:not(.public-document-reading-disabled) :is(#view-about, #view-privacy, #view-howto) [data-public-reading-body][data-public-reading-width="wide"] {\n    max-width: 100%;\n}\n@media print {\n    :is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content) {\n        max-width: none !important;\n    }\n}\n</style>'''
          s=s[:start]+new+s[end+8:]

          # Update the JS so enabled width targets only a dedicated inner reading body; disabled removes inline styles.
          js_start=s.find('function applyPublicDocumentReadingSettings()')
          if js_start == -1: raise SystemExit('reading JS not found')
          js_end=s.find('\n    function installAppConfigHook()', js_start)
          if js_end == -1: raise SystemExit('reading JS boundary not found')
          fn='''function applyPublicDocumentReadingSettings() {\n        const html = document.documentElement;\n        const enabled = !html.classList.contains('public-document-reading-disabled');\n        const roots = document.querySelectorAll(':is(#view-about, #view-privacy, #view-howto) :is(.about-codex-content, .privacy-ledger-content, .howto-guide-content)');\n        roots.forEach((root) => {\n            const existing = root.querySelector('[data-public-reading-body]');\n            const body = existing || (() => {\n                const wrapper = document.createElement('div');\n                wrapper.setAttribute('data-public-reading-body', 'true');\n                while (root.firstElementChild) wrapper.appendChild(root.firstElementChild);\n                root.appendChild(wrapper);\n                return wrapper;\n            })();\n            root.style.width = '100%';\n            root.style.maxWidth = 'none';\n            if (!enabled) {\n                body.removeAttribute('data-public-reading-width');\n                body.style.removeProperty('max-width');\n                body.style.removeProperty('width');\n                body.style.removeProperty('margin-left');\n                body.style.removeProperty('margin-right');\n            } else {\n                const styles = getComputedStyle(html);\n                body.style.setProperty('max-width', styles.getPropertyValue('--article-max-width').trim() || '820px');\n                body.style.setProperty('width', '100%');\n                body.style.setProperty('margin-left', 'auto');\n                body.style.setProperty('margin-right', 'auto');\n            }\n            root.querySelectorAll('p, li, td, th, blockquote, dt, dd, figcaption').forEach((element) => {\n                element.toggleAttribute('data-reading-settings-inline', true);\n                if (!enabled) {\n                    element.style.removeProperty('font-size');\n                    element.style.removeProperty('line-height');\n                    element.style.removeProperty('font-family');\n                    return;\n                }\n                const styles = getComputedStyle(html);\n                element.style.setProperty('font-size', styles.getPropertyValue('--article-font-size').trim());\n                element.style.setProperty('line-height', styles.getPropertyValue('--article-line-height').trim());\n                element.style.setProperty('font-family', styles.getPropertyValue('--article-font-family').trim());\n            });\n        });\n    }\n'''
          s=s[:js_start]+fn+s[js_end:]

          # Keep history archive metadata internally coherent with the current policy.
          hp=Path('assets/data/public-document-history.json')
          data=json.loads(hp.read_text(encoding='utf-8'))
          data['generatedAt']='2026-09-14T00:00:00+09:00'
          privacy=data.get('documents',{}).get('privacy',{}).get('versions',[])
          # Remove stale duplicate current-edition entries and ensure 29/30 are represented by real metadata where possible.
          for item in privacy:
              if item.get('edition') == 30:
                  item['revisedLabel']='2026/09/13 (第30版)'
              if item.get('edition') == 29 and item.get('revisedLabel') in ('2026/08/29 (第29版)',''):
                  item['revisedLabel']='2026/08/29 (第29版)'
          hp.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n',encoding='utf-8')
          PY

          # Add a source-level regression test for the actual contract.
          cat > tests/public-document-reading-regression.cjs <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync(path.resolve(__dirname, '..', 'index.html'), 'utf8');
          assert.equal((html.match(/id="settings-public-documents-toggle"/g) || []).length, 1);
          assert(html.includes("AppConfig.toggle('publicDocumentReading', this.checked)"));
          assert(html.includes('html:not(.public-document-reading-disabled)'));
          assert(html.includes('[data-public-reading-body]'));
          assert(html.includes("root.style.maxWidth = 'none'"));
          assert(!html.includes(':is(.about-codex-content, .privacy-ledger-content, .howto-guide-content, article, .article-content) {\n    max-width: var(--article-max-width) !important;'));
          assert(html.includes('function applyPublicDocumentReadingSettings()'));
          console.log('public document reading contract passed');
          JS

          node --check tests/public-document-reading-regression.cjs
          node tests/public-document-reading-regression.cjs
          node --check tests/home-article-layout-regression.cjs

          # Verify privacy edition markers.
          grep -q '制定: 2026/01/02 ・ 改定: 2026/09/13 (第30版) ・ 運営: nden148' index.html
          grep -q '現行版：第30版（最終改定日：2026年9月13日）' index.html
          ! grep -q '現行版：第29版（最終改定日：2026年8月29日）' index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/data/public-document-history.json tests/public-document-reading-regression.cjs .github/workflows/fix-privacy-reading-0914.yml
          git commit -m 'fix: repair privacy edition and public reading settings'
          git rm .github/workflows/fix-privacy-reading-0914.yml
          git commit --amend --no-edit
          git push
