name: Repair timezone final

on: [push]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_SHA}" = "" ]; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "AppConfig.toggle('timeZone', next)" not in s:
              old='settings.timeZone = next;'
              if old not in s:
                  raise SystemExit('timezone setter not found')
              new="""if (typeof AppConfig !== 'undefined' && typeof AppConfig.toggle === 'function') {
                  AppConfig.toggle('timeZone', next);
              } else {
                  settings.timeZone = next;
              }
              try { window.localStorage.setItem('tenmei_timezone_setting', next); } catch (e) {}"""
              s=s.replace(old,new,1)
          old="return new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');"
          new="return new Date().toLocaleDateString('ja-JP', { timeZone: getTimeZone(), year: 'numeric', month: '2-digit', day: '2-digit' }).replaceAll('/', '-');"
          s=s.replace(old,new,1)
          old="var todayKey = new Date().toISOString().slice(0,10);"
          new="var todayKey = window.TenmeiTime && typeof window.TenmeiTime.getDateKey === 'function' ? window.TenmeiTime.getDateKey() : new Date().toISOString().slice(0,10);"
          s=s.replace(old,new,1)
          stamp=datetime.now(timezone.utc).isoformat(timespec='seconds')
          marker='<meta name="tenmei-build" content="'
          if marker in s:
              s=re.sub(r'<meta name="tenmei-build" content="[^"]*"\s*/?>',f'<meta name="tenmei-build" content="{stamp}" />',s,count=1)
          else:
              i=s.find('</head>')
              if i<0: raise SystemExit('head not found')
              s=s[:i]+f'<meta name="tenmei-build" content="{stamp}" />\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "AppConfig.toggle('timeZone', next)" index.html
          grep -q 'tenmei_timezone_setting' index.html
          grep -q 'tenmei-build' index.html
          cat > tests/timezone-control-regression.cjs <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          assert(html.includes("AppConfig.toggle('timeZone', next)"));
          assert(html.includes('tenmei_timezone_setting'));
          assert(html.includes('getTimeZone()'));
          assert(html.includes('name="tenmei-build"'));
          console.log('timezone regression passed');
          JS
          node tests/timezone-control-regression.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-timezone-final.yml
          git add index.html tests/timezone-control-regression.cjs .github/workflows/repair-timezone-final.yml
          git commit -m 'fix: repair timezone control and production source'
          git push
