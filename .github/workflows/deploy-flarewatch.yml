name: Deploy FlareWatch Status

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-flarewatch.yml'
      - 'status/flarewatch-config/**'
      - 'status/flarewatch-public.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flarewatch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clone pinned FlareWatch release
        run: |
          git clone --depth 1 https://github.com/saminnet/flarewatch.git flarewatch
          cd flarewatch
          git fetch --depth 1 origin b1838d2a28bfd80e756eca400b8d23d2092c0911
          git checkout b1838d2a28bfd80e756eca400b8d23d2092c0911

      - name: Apply Tenmei configuration
        run: |
          cp status/flarewatch-config/worker.ts flarewatch/packages/config/src/worker.ts
          cp status/flarewatch-public.ts flarewatch/packages/config/src/public.ts

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: '24'
          cache: true
          run-install: true

      - name: Verify Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Ensure KV namespace exists
        working-directory: flarewatch
        run: |
          set -euo pipefail
          title="flarewatch-state"
          id="$(vp exec --filter worker -- wrangler kv namespace list | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].id // empty')"
          if [ -z "$id" ]; then
            vp exec --filter worker -- wrangler kv namespace create "$title"
            id="$(vp exec --filter worker -- wrangler kv namespace list | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].id // empty')"
          fi
          test -n "$id"
          echo "KV_NAMESPACE_ID=$id" >> "$GITHUB_ENV"

      - name: Inject KV namespace
        working-directory: flarewatch
        run: |
          sed -i "s/__FLAREWATCH_STATE_KV_NAMESPACE_ID__/$KV_NAMESPACE_ID/g" services/worker/wrangler.toml
          sed -i "s/__FLAREWATCH_STATE_KV_NAMESPACE_ID__/$KV_NAMESPACE_ID/g" apps/status-page/wrangler.jsonc

      - name: Deploy monitoring Worker
        working-directory: flarewatch
        run: vp exec --filter worker -- wrangler deploy --config wrangler.toml

      - name: Build and deploy status page
        working-directory: flarewatch
        run: |
          vp run --filter status-page build
          vp exec --filter status-page -- wrangler deploy --config dist/server/wrangler.json

      - name: Show status URL
        run: |
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')"
          if [ -n "$subdomain" ]; then
            echo "Status page: https://flarewatch.$subdomain.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
