name: Generate Upptime status page

on:
  push:
    paths:
      - ".upptimerc.yml"
      - ".github/workflows/upptime-status-page.yml"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: tenmei-status-main
  cancel-in-progress: false

jobs:
  upptime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Upptime check
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: update
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate Upptime response-time graphs
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: graphs
        env:
          GH_PAT: ${{ github.token }}

      - name: Generate the official Upptime status website
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Replace public status page with the generated Upptime site
        run: |
          test -d site/status-page/__sapper__/export
          rm -rf status/*
          cp -R site/status-page/__sapper__/export/. status/
          test -f status/index.html

      - name: Make generated status assets proxy-safe
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "status/index.html";
          let html = fs.readFileSync(path, "utf8");

          html = html
            .replace(
              /https:\/\/nden14800\.github\.io\/tenmei-mori\/themes\/light\.css/g,
              "/themes/light.css"
            )
            .replace(
              /https:\/\/nden14800\.github\.io\/tenmei-mori\/global\.css/g,
              "/global.css"
            )
            .replace(
              /https:\/\/raw\.githubusercontent\.com\/upptime\/upptime\/master\/assets\/upptime-icon\.svg/g,
              "/upptime-icon.svg"
            );

          fs.writeFileSync(path, html);
          NODE

          cp status/assets/upptime-icon.svg status/upptime-icon.svg 2>/dev/null || true

          test -f status/themes/light.css
          test -f status/global.css
          grep -F 'href=/themes/light.css' status/index.html
          grep -F 'href=/global.css' status/index.html
          if grep -F 'https://nden14800.github.io/tenmei-mori/themes/light.css' status/index.html; then exit 1; fi
          if grep -F 'https://nden14800.github.io/tenmei-mori/global.css' status/index.html; then exit 1; fi

      - name: Add Upptime license notice to generated status page
        run: |
          cat > status/LICENSE <<'EOF'
          Upptime third-party notice
          ==========================

          The generated status page in this directory is produced with Upptime.

          Upptime code is licensed under the MIT License.
          Copyright (c) Anand Chowdhary.

          Upptime's history data is distributed under the Open Database License
          (ODbL), as documented by the Upptime project.

          Upptime source:
          https://github.com/upptime/upptime

          Upptime uptime-monitor action:
          https://github.com/upptime/uptime-monitor

          These notices do not change the license terms of the original
          Upptime project or any other third-party component.
          EOF

          test -f status/LICENSE
          grep -F 'Upptime code is licensed under the MIT License.' status/LICENSE
          grep -F "Upptime's history data is distributed under the Open Database License" status/LICENSE

      - name: Commit generated Upptime data and status page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          if git diff --cached --quiet; then
            echo "No generated status page changes."
            exit 0
          fi
          git commit -m "chore(status): update official Upptime status page"
          git pull --rebase origin main
          git push
