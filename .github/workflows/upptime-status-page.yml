name: Generate Upptime status page

on:
  push:
    paths:
      - ".upptimerc.yml"
      - ".github/workflows/upptime-status-page.yml"
      - "status/global.css"
      - "status/custom-status.js"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  status-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the official Upptime status website
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Preserve custom public status UI
        run: |
          test -f status/global.css
          cp status/global.css /tmp/tenmei-status-global.css
          cp status/custom-status.js /tmp/tenmei-custom-status.js

      - name: Replace public status page with the generated Upptime site
        run: |
          test -d site/status-page/__sapper__/export
          rm -rf status/*
          cp -R site/status-page/__sapper__/export/. status/
          test -f status/index.html
          cp /tmp/tenmei-status-global.css status/global.css
          cp /tmp/tenmei-custom-status.js status/custom-status.js

      - name: Copy Upptime data into the public status site
        run: |
          test -d graphs
          test -d history
          test -d api
          rm -rf status/graphs status/history status/api
          cp -R graphs status/graphs
          cp -R history status/history
          cp -R api status/api
          test -f status/graphs/tenmei-mori/response-time-week.png
          test -f status/history/summary.json

      - name: Make generated Upptime data paths local and proxy-safe
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = "status/client";

          for (const name of fs.readdirSync(root)) {
            if (!name.endsWith(".js")) continue;
            const file = path.join(root, name);
            let js = fs.readFileSync(file, "utf8");
            if (!js.includes("/master/graphs") && !js.includes("/master/history/summary.json")) continue;

            js = js
              .replace('i||(i="https://raw.githubusercontent.com")', 'i||(i="")')
              .replace('const o=`${i}/${r}/${l}/master/graphs`', 'const o="/graphs"')
              .replace('fetch(`${i}/${r}/${l}/master/history/summary.json`)', 'fetch("/history/summary.json")');

            fs.writeFileSync(file, js);
          }
          NODE

          if grep -R -F '/master/graphs' status/client; then exit 1; fi
          if grep -R -F '/master/history/summary.json' status/client; then exit 1; fi

      - name: Make generated status assets proxy-safe
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "status/index.html";
          let html = fs.readFileSync(path, "utf8");

          html = html
            .replace(
              /https:\/\/nden14800\.github\.io\/tenmei-mori\/themes\/light\.css/g,
              "/themes/light.css"
            )
            .replace(
              /https:\/\/nden14800\.github\.io\/tenmei-mori\/global\.css/g,
              "/global.css"
            )
            .replace(
              /https:\/\/raw\.githubusercontent\.com\/upptime\/upptime\/master\/assets\/upptime-icon\.svg/g,
              "/upptime-icon.svg"
            );

          fs.writeFileSync(path, html);
          NODE

          cp status/assets/upptime-icon.svg status/upptime-icon.svg 2>/dev/null || true

          test -f status/themes/light.css
          test -f status/global.css
          grep -F 'href=/themes/light.css' status/index.html
          grep -F 'href=/global.css' status/index.html

      - name: Add custom status page script
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "status/index.html";
          let html = fs.readFileSync(path, "utf8");
          const tag = '<script src="/custom-status.js"></script>';
          if (!html.includes(tag)) html = html.replace("</body>", tag + "</body>");
          fs.writeFileSync(path, html);
          NODE

      - name: Add Upptime license notice to generated status page
        run: |
          cat > status/LICENSE <<'EOF'
          Upptime third-party notice
          ==========================

          The generated status page in this directory is produced with Upptime.

          Upptime code is licensed under the MIT License.
          Copyright (c) Anand Chowdhary.

          Upptime's history data is distributed under the Open Database License
          (ODbL), as documented by the Upptime project.

          Upptime source:
          https://github.com/upptime/upptime

          Upptime uptime-monitor action:
          https://github.com/upptime/uptime-monitor

          These notices do not change the license terms of the original
          Upptime project or any other third-party component.
          EOF

      - name: Commit generated status page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          if git diff --cached --quiet; then
            echo "No generated status page changes."
            exit 0
          fi
          git commit -m "chore(status): update official Upptime status page"
          git pull --rebase origin main
          git push
