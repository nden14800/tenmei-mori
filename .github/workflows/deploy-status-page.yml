name: Deploy service status page

on:
  push:
    branches: [main]
    paths:
      - 'status/**'
      - '.github/workflows/deploy-status-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-status-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy status page to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tenmei-mori-status.pages.dev/
    steps:
      - name: Check out production source
        uses: actions/checkout@v6
      - name: Verify status entry point
        run: test -f status/index.html
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy status --project-name=tenmei-mori-status --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
